name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'
  PHP_EXTENSIONS: gd, intl, zip, exif, bcmath, pdo_sqlite, sqlite3

jobs:
  quality:
    name: Lint, static analysis and unit tests (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: bin/make-env .env
      # Wayfinder reads column types from the database (integer route keys), so
      # generate against a migrated SQLite database, as in development.
      - run: touch database/database.sqlite && php artisan migrate --force --no-interaction
      - run: php artisan wayfinder:generate --with-form

      - name: Pint (code style)
        run: vendor/bin/pint --test
      - name: Larastan (level 7)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Format, lint and type-aware checks
        run: npm run check
      - name: vue-tsc
        run: npm run types:check
      - name: Vitest
        run: npm run test

  tests:
    name: Pest (feature, arch, coverage ≥ 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: pcov

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: bin/make-env .env
      - run: npm run build
      - run: php artisan test --coverage --min=90

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      APP_ENV: e2e
      E2E_BASE_URL: http://127.0.0.1:8010
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Prepare the e2e environment
        run: |
          bin/make-env .env
          bin/make-env .env.e2e APP_ENV=e2e "APP_URL=${E2E_BASE_URL}" \
            "DB_DATABASE=${{ github.workspace }}/database/e2e.sqlite" MEDIA_CHUNK_SIZE=1048576 \
            MAIL_MAILER=log DEMO_MODE=true INERTIA_SSR_THROW_ON_ERROR=true
          touch database/e2e.sqlite
          php artisan migrate:fresh --seed --force
          php artisan storage:link
      - run: npm run build
      - name: Generate the sample video fixture
        run: >
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=duration=6:size=1280x720:rate=25
          -f lavfi -i sine=frequency=440:duration=6 -shortest -c:v libx264 -b:v 3M -c:a aac -y e2e/fixtures/sample.mp4
      - name: Start the app, the SSR server and the queue worker
        run: |
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=127.0.0.1 --port=8010 --no-reload > storage/logs/serve.log 2>&1 &
          node bootstrap/ssr/app.js > storage/logs/ssr.log 2>&1 &
          php artisan queue:work --queue=media,default --tries=2 --timeout=600 > storage/logs/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fs "${E2E_BASE_URL}/up" && curl -fs http://127.0.0.1:13714/health && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e-report
            e2e-results
            storage/logs
          retention-days: 7
