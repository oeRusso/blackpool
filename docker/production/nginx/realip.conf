# Restore the visitor IP. Nginx publishes no port: the only client that can
# reach it is the `cloudflared` container on the compose network, which
# forwards Cloudflare's CF-Connecting-IP header.
real_ip_header CF-Connecting-IP;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
