# Shared server configuration (included by the HTTP and HTTPS server blocks).
root /var/www/html/public;
index index.php;
charset utf-8;
client_max_body_size 32m;
server_tokens off;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/vnd.apple.mpegurl;

# Fingerprinted Vite assets can be cached forever (by browsers and Cloudflare).
location /build/ {
    expires max;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location /storage/ {
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Protected lesson videos: Laravel authorizes the request and replies with
# X-Accel-Redirect; Nginx then streams the file from the media volume.
location /protected-media/ {
    internal;
    alias /var/www/html/storage/app/media/;
    add_header Cache-Control "private, max-age=86400";
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        image/jpeg jpg;
    }
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; try_files $uri /index.php?$query_string; }

location ~ \.php$ {
    fastcgi_pass app:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_param HTTPS $forwarded_https;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 120s;
    # Preload Link headers + CSP + cookies exceed the default 4-8 KB header buffer.
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
}

location ~ /\.(?!well-known).* {
    deny all;
}
