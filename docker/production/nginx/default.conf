# Cloudflare (SSL mode "Full (strict)") -> Nginx with a Cloudflare Origin Certificate.
include /etc/nginx/snippets/cloudflare.conf;

map $scheme $forwarded_https {
    https on;
    default off;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/app.conf;
}
