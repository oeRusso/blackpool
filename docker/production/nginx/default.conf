# Cloudflare (HTTPS) -> Cloudflare Tunnel (cloudflared container) -> Nginx (plain HTTP on the
# internal network). TLS is terminated by Cloudflare, so Nginx tells PHP the original scheme.
include /etc/nginx/snippets/realip.conf;

map $http_x_forwarded_proto $forwarded_https {
    https on;
    default off;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    include /etc/nginx/snippets/app.conf;
}
