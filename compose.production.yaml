# Production stack for a single VPS (e.g. Contabo) behind Cloudflare.
#   docker compose -f compose.production.yaml --env-file .env up -d --build
# See docs/DEPLOYMENT.md.

x-app: &app
    image: blackpool-app:${IMAGE_TAG:-latest}
    build:
        context: .
        dockerfile: docker/production/Dockerfile
        target: app
    env_file: ${APP_ENV_FILE:-.env}
    restart: unless-stopped
    volumes:
        - storage:/var/www/html/storage
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    web:
        image: blackpool-web:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: docker/production/Dockerfile
            target: web
        restart: unless-stopped
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
        volumes:
            - storage:/var/www/html/storage:ro
            - ${NGINX_CONF:-./docker/production/nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
            - ./docker/production/certs:/etc/nginx/certs:ro
        depends_on:
            - app
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '-qO-',
                    '--header',
                    'Host: localhost',
                    'http://127.0.0.1/up',
                ]
            interval: 30s
            timeout: 5s
            retries: 3

    app:
        <<: *app
        environment:
            CONTAINER_ROLE: app
            RUN_MIGRATIONS: 'true'
        healthcheck:
            test: ['CMD-SHELL', 'php-fpm -t >/dev/null 2>&1']
            interval: 30s
            timeout: 5s
            retries: 3

    worker:
        <<: *app
        environment:
            CONTAINER_ROLE: worker
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--queue=media,default',
                '--tries=2',
                '--timeout=3600',
                '--sleep=3',
                '--max-time=3600',
            ]
        stop_grace_period: 60s

    scheduler:
        <<: *app
        environment:
            CONTAINER_ROLE: scheduler
        command: ['php', 'artisan', 'schedule:work']

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent',
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command:
            [
                'redis-server',
                '--appendonly',
                'yes',
                '--maxmemory-policy',
                'noeviction',
            ]
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 10

volumes:
    storage:
    mysql:
    redis:
